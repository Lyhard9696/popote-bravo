{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="card narrow login-premium-card">
  <p class="eyebrow">Popote Bravo</p><h1>Connexion</h1>
  <form method="post"><label>Nom / pseudo</label><input id="login-name" name="name" required autocomplete="username"><label>Mot de passe</label><input name="password" type="password" required autocomplete="current-password"><button type="submit">Se connecter</button></form>
  <div class="login-divider"><span>ou</span></div>
  <button type="button" id="passkey-login" class="passkey-button">🔐 Se connecter avec Face ID / Passkey</button>
  <p id="passkey-login-status" class="passkey-status"></p>
  <p class="muted">Pas encore de compte ? <a href="{{ url_for('register') }}">Créer un compte</a></p>
</div>
<script>
const b64ToBufLogin=(v)=>{v=v.replace(/-/g,'+').replace(/_/g,'/');while(v.length%4)v+='=';const s=atob(v);return Uint8Array.from(s,c=>c.charCodeAt(0)).buffer};
const bufToB64Login=(buf)=>{let s='';new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const pk=document.getElementById('passkey-login'), st=document.getElementById('passkey-login-status'); if(!window.PublicKeyCredential){pk.hidden=true;}
pk?.addEventListener('click',async()=>{try{const name=document.getElementById('login-name').value.trim();if(!name){st.textContent='Entre d’abord ton nom / pseudo.';return;}st.textContent='Ouverture de Face ID…';let r=await fetch('{{ url_for("passkey_auth_options") }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});let o=await r.json();if(!r.ok)throw new Error(o.error||'Erreur');o.challenge=b64ToBufLogin(o.challenge);(o.allowCredentials||[]).forEach(c=>c.id=b64ToBufLogin(c.id));const cred=await navigator.credentials.get({publicKey:o});const payload={id:cred.id,rawId:bufToB64Login(cred.rawId),type:cred.type,clientExtensionResults:cred.getClientExtensionResults(),authenticatorAttachment:cred.authenticatorAttachment,response:{authenticatorData:bufToB64Login(cred.response.authenticatorData),clientDataJSON:bufToB64Login(cred.response.clientDataJSON),signature:bufToB64Login(cred.response.signature),userHandle:cred.response.userHandle?bufToB64Login(cred.response.userHandle):null}};r=await fetch('{{ url_for("passkey_auth_verify") }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw new Error(data.error||'Erreur');location.assign(data.redirect);}catch(e){st.textContent=e.name==='NotAllowedError'?'Connexion annulée.':e.message;}});
</script>
{% endblock %}
